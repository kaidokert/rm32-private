[workspace]
members = ["rm32"]
resolver = "2"

# rm32_stm32 is excluded from default build - it requires ARM target
# Build with: cargo build -p rm32_stm32 --target thumbv6m-none-eabi
# binz (NUCLEO-G071RB bringup) is likewise ARM-only; build from inside binz/
# (its own .cargo/config.toml sets target + probe-rs runner).
exclude = ["rm32_stm32", "ref", "minz", "rinz", "binz"]
