[package]
name = "rinz"
version = "0.1.0"
edition = "2024"

[dependencies]
atomic = { version = "0.6.1", default-features = false }
bytemuck = { version = "1.23.2", default-features = false }
embedded-hal = "1.0.0"
embedded-io = "0.6.1"
fixed = "1.29.0"
fugit = "0.4.0"
paste = "1.0"
portable-atomic = "1.13.1"

[target.'cfg(target_arch = "arm")'.dependencies]
systick-timer = "0.2.3"
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
rtt-target = "0.6.2"
stm32g4xx-hal = { version = "0.1.0", features = ["stm32g431", "rt"] }
