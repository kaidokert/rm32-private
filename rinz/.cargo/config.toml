[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip STM32G431CB --probe 0483:374b:066CFF515152827187153226"

# Host-side iteration for the portable closed-loop algos (no crate split needed --
# firmware deps are cfg(target_arch="arm")-gated, so the pure lib builds on host).
# `cargo test-host` runs the lib unit tests on host; `--lib` skips the firmware
# examples (which need the arm-only HAL). `cargo cl-replay` runs the capture-replay
# integration harness (tests/cl_replay.rs) that pushes captured frames through the
# detector+PLL exactly as the ISR would.
[alias]
test-host = "test --lib --target x86_64-pc-windows-msvc"
cl-replay = "test --test cl_replay --target x86_64-pc-windows-msvc -- --nocapture"
