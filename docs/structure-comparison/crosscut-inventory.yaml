tests_and_verification:
  minz:
    - claim: "minz-core is intentionally detached for host cargo test and carries module-local regression tests."
      evidence:
        - "minz/core/Cargo.toml:5-15"
        - "minz/core/src/lib.rs:1-13"
        - "minz/core/src/zc.rs:1066-1066 (48 kHz sector-boundary regression)"
        - "minz/core/src/guards.rs:1112-1112 (runaway-floor regression)"
    - claim: "AM32-clone control and ISR code use a shared call-recording MockHal that can assert safety-relevant hardware effects."
      evidence:
        - "minz/core/src/am32_hal.rs:139-191"
        - "minz/core/src/am32_control.rs:460-465"
        - "minz/core/src/am32_control.rs:662-662 (safety-kill HAL-call test)"
        - "minz/core/src/am32_isr.rs:489-489 (killed TIM6 behavior test)"
    - claim: "motor_tester2 consumes many extracted helpers, but still owns its large ISR/orchestration state in the example."
      evidence:
        - "minz/examples/motor_tester2.rs:4679-4801 (window/mode/ZC/kill static wiring)"
        - "minz/examples/motor_tester2.rs:6051-6086 (ADC zero-cross confirmation calls into minz-core)"
  rm32:
    - claim: "Core modules carry unit tests for commutation, BEMF, state, protocol, and orchestration behavior."
      evidence:
        - "rm32/src/commutation.rs:101-165"
        - "rm32/src/bemf.rs:1-88"
        - "rm32/src/system.rs:181-229"
    - claim: "The native rm32_harness implements HAL mocks and invokes the same SystemTick orchestration used by firmware."
      evidence:
        - "rm32/Cargo.toml:12-14"
        - "rm32/src/bin/harness.rs:25-133"
        - "rm32/src/bin/harness.rs:463-475"
        - "rm32/src/system.rs:1-6"
    - claim: "Python black-box tests discover vector files and drive them through the native harness."
