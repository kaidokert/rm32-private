    minz:
      names: ["am32_hal::Hal", "MotorPwm", "CompCtl", "ComTimers", "Recorder", "Cs", "InjAdc", "LoopTimer"]
      evidence:
        - "minz/core/src/am32_hal.rs:22-137"
        - "minz/src/lib.rs:34-47"
    rm32:
      names: ["hal::MotorHal", "PwmOutput", "Comparator", "PhaseOutput", "IntervalTimer", "ComTimer", "IsrHal"]
      evidence:
        - "rm32/src/hal.rs:14-84"
        - "rm32_stm32/src/isr.rs:19-68"
    relationship: "overlap_with_different_granularity"

