        - "tests/blackbox/test_vectors.py:27-52"
        - "tests/blackbox/harness.py:144-168"

limitations:
  - "This inventory compares checked-in source structure, not generated OUT_DIR board_config.rs output or compiled binaries."
  - "Vendor HAL/PAC implementations and the external AM32 C source cited in comments were not audited; citations here prove repository structure and local behavior only."
  - "minz/captures and most bench scripts were excluded from source-structure claims; they are experimental artifacts rather than firmware abstractions."
  - "Only the L431 interrupt/initialization path was traced deeply in rm32_stm32 because it is the direct hardware overlap with minz. Other MCU directories were inventoried at their module/feature boundary."
  - "A repository search found no minz process harness shaped like rm32_harness, but absence claims are intentionally not elevated into a proven trait; the final report should phrase this as 'no equivalent located' if needed."
  - "The conceptual Sched/Drive/Duty/Bench mappings combine several rm32 types and should not be interpreted as field-for-field equivalence."

comparison_candidates:
  - category: overlap
    title: "AM32 temporal skeleton"
    claim: "Both use comparator ISR -> one-shot commutation ISR -> 20 kHz duty/polling ISR plus a spinning main loop."
    evidence:
      - "minz/examples/am32_clone.rs:19-33"
      - "rm32_stm32/src/isr_handlers.rs:71-146"
      - "rm32_stm32/src/bin/main.rs:474-481"

  - category: overlap
    title: "Host-testable static-dispatch motor logic"
    claim: "Both isolate motor-critical logic behind monomorphized traits and provide HAL mocks."
    evidence:
      - "minz/core/src/am32_hal.rs:1-20"
      - "minz/core/src/am32_hal.rs:139-191"
      - "rm32/src/hal.rs:68-84"
      - "rm32/src/bin/harness.rs:25-133"

  - category: structural_mismatch
    title: "Shared atomic clusters versus owned contexts"
    claim: "minz uses atomics as the primary storage even for control clusters; rm32 uses mutable ISR/main owners and atomics specifically as the bridge."
    evidence:
      - "minz/examples/am32_clone.rs:103-152"
      - "minz/examples/am32_clone.rs:244-303"
      - "rm32_stm32/src/isr.rs:70-88"
      - "rm32_stm32/src/isr_handlers.rs:12-35"
      - "rm32/src/shared_state.rs:17-74"

  - category: structural_mismatch
    title: "HAL responsibility split"
    claim: "minz folds phase roles into MotorPwm and both timers into ComTimers; rm32 separates those responsibilities before rebundling them in MotorHal."
    evidence:
      - "minz/core/src/am32_hal.rs:22-87"
      - "rm32/src/hal.rs:14-84"

  - category: structural_mismatch
    title: "Fixed bench target versus board/MCU matrix"
    claim: "minz directly targets one L431 pinout; rm32_stm32 has target-feature selection, per-MCU adapters, and generated YAML board configuration."
    evidence:
      - "minz/Cargo.toml:24-25"
      - "minz/src/board_init.rs:59-70"
      - "rm32_stm32/Cargo.toml:38-43"
      - "rm32_stm32/src/mcu.rs:22-35"
      - "rm32_stm32/build.rs:210-258"

  - category: similar_concepts_different_names
    title: "Control state clusters"
    claim: "minz Sched/Drive/Duty roughly align with rm32 Timing/SharedState, Commutation/BemfState, and DutyState respectively."
    evidence:
      - "minz/core/src/am32_loop.rs:82-136"
      - "rm32/src/commutation.rs:3-12"
      - "rm32/src/control/state.rs:8-40"
      - "rm32/src/control/state.rs:367-376"

  - category: similar_concepts_different_names
    title: "Comparator and commutation adapters"
    claim: "minz CompCtl/change_comp_input and MotorPwm/set_roles_for_step correspond to rm32 Comparator/change_input and PhaseOutput/com_step, with a 0..5 versus 1..6 adapter boundary."
    evidence:
      - "minz/core/src/am32_hal.rs:48-68"
      - "minz/core/src/am32_control.rs:45-63"
      - "rm32/src/hal.rs:28-53"
      - "rm32_stm32/src/comparator.rs:28-52"
      - "rm32_stm32/src/phase.rs:111-148"

  - category: one_sided_rm32
    title: "Production protocol/configuration breadth"
    claim: "rm32 structurally includes EEPROM persistence, DShot/servo/CRSF/EDT inputs, bidirectional telemetry, sine/brake modes, and three PID loops beyond the minz AM32 clone's declared UART-duty factory subset."
    evidence:
      - "minz/examples/am32_clone.rs:5-9"
      - "minz/core/src/am32_control.rs:376-378"
      - "rm32/src/config.rs:17-78"
      - "rm32_stm32/src/isr.rs:76-87"
      - "rm32/src/control/state.rs:198-213"
      - "rm32/src/system.rs:92-133"

  - category: one_sided_minz
    title: "Experimental closed-loop instrumentation stack"
    claim: "minz motor_tester2 exposes interactive frequency/amplitude control, waveform switching, comparator phase/hysteresis/edge experiments, window/ZC diagnostics, and a bench guard stack as a separate firmware personality."
    evidence:
      - "minz/examples/motor_tester2.rs:20-48"
      - "minz/examples/motor_tester2.rs:4679-4801"
      - "minz/core/src/lib.rs:23-39 (blackbox/drive/guards/window/zc module surface)"

  - category: one_sided_rm32
    title: "Canonical process black-box harness"
    claim: "rm32 checks a firmware-style pipeline through rm32_harness and pytest vectors, using SystemTick shared with firmware."
    evidence:
      - "rm32/src/system.rs:1-6"
      - "rm32/src/bin/harness.rs:463-475"
      - "tests/blackbox/test_vectors.py:27-52"

  - category: risk_or_reconciliation
    title: "Same-board constants drift"
    claim: "The same Vimdrones L431 hardware identity has separate configuration sources and currently different dead-time values (45 versus 60), so consolidation must not assume board settings are shared."
    evidence:
