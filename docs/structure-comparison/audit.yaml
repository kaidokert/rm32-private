date: "2026-07-22"

inputs:
  inventories:
    - docs/structure-comparison/minz-inventory.yaml
    - docs/structure-comparison/rm32-inventory.yaml
    - docs/structure-comparison/crosscut-inventory.yaml
  independent_audits:
    - docs/structure-comparison/audit-minz.yaml
    - docs/structure-comparison/audit-rm32.yaml
    - docs/structure-comparison/audit-crosscut.yaml
  policy:
    - "Executable source, manifests, build logic, tests, and board YAML outrank design comments."
    - "MinZ am32_clone and motor_tester2 are separate implementation profiles."
    - "A declared module, enum variant, or handler is not proof of end-to-end firmware wiring."
    - "Host tests and cross-builds are not evidence of PAC, NVIC, DMA, or electrical runtime behavior."

overall_verdict:
  status: qualified_comparison_supported
  summary: >-
    The inventories support a detailed comparison. Both implementations extract
    host-testable motor logic behind statically dispatched ESC-domain traits and
    retain target-specific interrupt/register adapters. Their dominant ownership
    models differ: am32_clone uses shared atomic storage grouped into borrowed
    views, motor_tester2 uses a much larger example-owned integration surface,
    and rm32 predominantly owns mutable main/ISR state separately with atomics as
    a directional bridge. Several first-pass claims required material qualification.

profile_verdicts:
  minz_am32_clone:
    status: confirmed_with_scope_limits
    findings:
      - "Compact factory-default, forward-only AM32 transliteration."
      - "Seven-capability generic HAL and parameterized control/ISR bodies are host-testable."
      - "Program-owned atomics are grouped as Sched, Drive, Duty, and Bench borrowed views."
    evidence:
      - "minz/examples/am32_clone.rs:1-17,103-152,237-360"
      - "minz/core/src/am32_hal.rs:22-191"
      - "minz/core/src/am32_isr.rs:33-288"
  minz_motor_tester2:
    status: confirmed_as_distinct_partial_extraction
    findings:
      - "Interactive bench/closed-loop experiment, not the same architecture as am32_clone."
      - "Broad minz-core helpers and selected borrowed views are reused, but full ISR and hardware-effect ordering remains in the example."
      - "No am32_hal-equivalent bundled hardware facade was found for this profile."
    evidence:
      - "minz/examples/motor_tester2.rs:1-49,191-1808,4116-4675,4686-4811,6315-6890"
      - "minz/src/tim1_motor_pwm.rs:423-426"
      - "minz/core/src/lib.rs:17-40"
  rm32_and_rm32_stm32:
    status: confirmed_with_current_integration_defects
    findings:
      - "Portable rm32 core plus STM32 platform/adaptation crate and one normal firmware binary."
      - "Broad domain HAL, lower register-operation seams, owned MainState/IsrState, and atomic SharedState mailbox."
      - "SystemTick is a shared pipeline slice, not the complete firmware loop."
      - "The L431 IsrCell safety premise is currently violated by nested interrupt priorities."
    evidence:
      - "rm32/src/hal.rs:14-152"
      - "rm32/src/system.rs:32-75,153-172"
      - "rm32_stm32/src/bin/main.rs:379-481"
      - "rm32_stm32/src/isr_handlers.rs:12-69"
      - "rm32_stm32/src/mcu_l431/init.rs:219-249"

corrections_applied:
  - id: separate_minz_profiles
    disposition: applied
    correction: "am32_clone and motor_tester2 are profiled independently throughout report.md."
    evidence: "docs/structure-comparison/audit-minz.yaml:22-40"
  - id: minz_hal_scope
    disposition: applied
    correction: >-
      The seven-capability Hal is attributed only to am32_clone. motor_tester2
      directly orchestrates platform free functions around extracted helpers.
    evidence: "minz/src/tim1_motor_pwm.rs:423-426; docs/structure-comparison/audit-minz.yaml:42-108"
  - id: systemtick_scope
    disposition: applied
    correction: >-
      SystemTick is described as the shared input/callback/synchronization/MainState
      slice. Sine MMIO, IRQ priorities, persistence, LED, reset, watchdog, and
      debug work remain outside it.
    evidence: "rm32/src/system.rs:153-172; rm32_stm32/src/bin/main.rs:379-481"
  - id: current_isrcell_violation
    disposition: applied
    correction: >-
      Reclassified from a future conditional risk to a current critical
      soundness risk on L431: every named handler obtains &mut state while the
      configured priorities permit preemption.
    evidence: "rm32_stm32/src/isr_handlers.rs:12-69,71-180; rm32_stm32/src/mcu_l431/init.rs:219-249"
  - id: nominal_slow_dispatch
    disposition: applied
    correction: "The slow block is nominal 1 kHz; >20 triggers after 21 increments, about 952.4 Hz at exactly 20 kHz."
    evidence: "rm32/src/constants.rs:28-31; rm32/src/shared_state.rs:230-243"
  - id: dead_time_selection_context
    disposition: applied
    correction: >-
      MinZ hard-codes DTG=45. rm32's default L431 board neutron_l431 also uses
      45; opt-in BOARD=vimdrones_l431 selects 60. This is separate-source,
      selection-dependent drift, not an unconditional default mismatch.
    evidence: "minz/src/lib.rs:100-103; rm32_stm32/build.rs:210-227; rm32_stm32/boards/neutron_l431.yaml:1-4; rm32_stm32/boards/vimdrones_l431.yaml:1-4"
  - id: physical_step_rotation
    disposition: applied
    correction: >-
      Beyond the 0..5 versus 1..6 API boundary, the concrete L431 tables have a
      one-step physical rotation: rm32 step 1 corresponds to MinZ logical step
      6, rm32 step 2 to MinZ logical step 1, and so on.
    evidence: "minz/src/tim1_motor_pwm.rs:205-240; minz/src/comp2.rs:286-320; rm32_stm32/src/phase.rs:111-148,194-197; rm32_stm32/src/comparator.rs:28-44"
  - id: comparator_pending_semantics
    disposition: applied
    correction: >-
      The common zero-cross skeleton is retained, but MinZ can preserve/re-pend
      a post-cross pending event across a closed gate; rm32 L431 clears and masks
      at ISR entry, while three other rm32 wrappers omit that mitigation.
    evidence: "minz/core/src/am32_isr.rs:33-61; minz/src/comp2.rs:244-311; rm32/src/control/isr_logic.rs:268-298; rm32_stm32/src/mcu_l431/interrupts.rs:27-49"
  - id: agents_polarity_history
    disposition: applied
    correction: >-
      AGENTS.md's parity warning is retained as historical guidance, not labeled
      a present motor_tester2 defect: current source locks POLARITY=0. It becomes
      actionable again if dynamic polarity switching returns.
    evidence: "minz/AGENTS.md:1-7,99-111; minz/examples/motor_tester2.rs:4539-4544,6561-6567"
  - id: declared_vs_wired_breadth
    disposition: applied
    correction: >-
      rm32's broad modules/configuration are separated from selected firmware
      reachability. DShot, servo, commands, EDT, and bidirectional transfer are
      wired; CRSF has a handler but no checked MCU vector caller; boot currently
      disables five complex settings.
    evidence: "rm32_stm32/src/isr_handlers.rs:242-359,369-381; rm32_stm32/src/bin/main.rs:196-218"
  - id: blackbox_current_result
    disposition: applied
    correction: "The harness seam is credited, but the current local result is 77 passes and one temperature_limit failure."
    evidence: "docs/structure-comparison/audit-rm32.yaml:469-478"

