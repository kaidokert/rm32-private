current_high_risks:
  - id: minz_killed_latch_consumed
    severity: high
    finding: "safety_kill sets killed=true, but foreground reporting consumes it with swap(false), removing the ISR gate and permitting later restart eligibility."
    evidence:
      - "minz/core/src/am32_control.rs:186-203"
      - "minz/examples/am32_clone.rs:413-428"
      - "minz/core/src/am32_isr.rs:136-166"
  - id: minz_panic_not_motor_safe_off
    severity: high
    finding: "The panic path reports and halts but does not independently force motor outputs off."
    evidence:
      - "minz/src/panic.rs:1-32"
  - id: minz_relaxed_atomic_protocol
    severity: medium
    finding: "Cross-context state is broadly shared through Relaxed atomics; correctness depends on single-core interrupt behavior and operation ordering rather than an explicit publication protocol."
    evidence:
      - "minz/examples/am32_clone.rs:101-158"
  - id: rm32_isrcell_aliasing
    severity: critical
    finding: "IsrCell returns a mutable reference under an equal-priority premise, while current L431 priorities permit nested handlers that obtain the same aggregate."
    evidence:
      - "rm32_stm32/src/isr_handlers.rs:12-69"
      - "rm32_stm32/src/mcu_l431/init.rs:219-249"
  - id: rm32_non_l431_comp_ack
    severity: high
    finding: "The portable BEMF filter can return before acknowledgement; only L431 performs the required entry mask/clear mitigation."
    evidence:
      - "rm32/src/control/isr_logic.rs:268-280"
      - "rm32_stm32/src/mcu_l431/interrupts.rs:27-49"
  - id: rm32_split_config_save
    severity: high
    finding: "ISR commands mutate an ISR config copy, while foreground persistence writes main_state.config; synchronization remains TODO."
    evidence:
      - "rm32_stm32/src/isr_handlers.rs:276-323"
      - "rm32_stm32/src/bin/main.rs:433-440"
  - id: rm32_build_selection
    severity: high
    finding: "Board MCU identity is not enforced against selected Cargo MCU features, and exactly-one MCU feature is not guarded."
    evidence:
      - "rm32_stm32/build.rs:214-245"
      - "rm32_stm32/src/mcu.rs:22-32"

completion:
  exhaustive_file_inventory: true
  symmetric_side_only_capabilities: true
  presence_vs_wiring_distinguished: true
  runtime_flows_compared: true
  risks_and_verification_reported: true
