executive_mapping:
  shared_architecture:
    - "Both separate portable control logic from register-facing STM32 adapters and use static dispatch for motor-critical HAL calls."
    - "Both implement the AM32 three-loop motor shape: comparator zero-cross event, one-shot commutation event, and approximately 20 kHz duty/polling tick, with a free-running foreground loop."
    - "Both use atomic cross-context state and host-test the logic that runs on target."
  primary_difference:
    minz: "A deliberately narrow L431 AM32 clone whose product is the motor-control experiment plus high-rate bench observability."
    rm32: "A configurable ESC product architecture: portable state machine, many input/output protocols and operating modes, generated boards, four MCU families, and a process-level behavioral harness."
  evidence:
    - "minz/examples/am32_clone.rs:11-28"
    - "minz/core/src/am32_hal.rs:1-24"
    - "rm32/src/control/isr_logic.rs:1-19"
    - "rm32_stm32/src/bin/main.rs:1-30"
    - "rm32_stm32/src/lib.rs:1-4"

mappings:
  - id: portable_motor_hal
    relationship: direct
    minz:
      paths: [minz/core/src/am32_hal.rs, minz/src/lib.rs]
      qualification: "PwmOutput, PhaseOutput, Comparator, IntervalTimer, ComTimer, and MotorHal intentionally copy rm32's shape; MinZ wires zero-sized L431 register types into Motor."
    rm32:
      paths: [rm32/src/hal.rs, rm32_stm32/src/isr.rs]
      qualification: "The canonical traits are implemented by a target-selected IsrHal bundle."
    evidence:
      - "minz/core/src/am32_hal.rs:26-66"
      - "minz/core/src/am32_hal.rs:78-104"
      - "minz/core/src/am32_hal.rs:141-205"
      - "rm32/src/hal.rs:14-68"
      - "rm32_stm32/src/isr.rs:19-68"

  - id: commutation_and_bemf_control
    relationship: direct
    audit_qualification: Direct control-domain correspondence, but comparator event policy differs; MinZ camps a pending edge until its half-interval gate opens, while rm32 L431 clears and masks at ISR entry.
    minz:
      paths: [minz/core/src/am32_control.rs, minz/core/src/am32_isr.rs, minz/core/src/am32.rs]
      qualification: "AM32-line-cited clone functions retain polling startup, COMP acceptance, delayed commutation, interval blend, advance, desync, and timeout bands."
    rm32:
      paths: [rm32/src/commutation.rs, rm32/src/control/isr_logic.rs, rm32/src/control/state.rs, rm32/src/main_state.rs]
      qualification: "The same concepts are decomposed into owned state objects and ISR/foreground functions, with extra state-machine/config branches."
    evidence:
      - "minz/core/src/am32_isr.rs:33-129"
      - "minz/core/src/am32_isr.rs:131-205"
      - "rm32/src/control/isr_logic.rs:15-19"
      - "rm32/src/control/isr_logic.rs:120-213"
      - "rm32/src/control/isr_logic.rs:216-298"
      - "rm32/src/main_state.rs:306-360"

  - id: pwm_phase_and_timers
    relationship: direct
    audit_qualification: Direct only for the L431 path; rm32 additionally supplies three other MCU-family realizations.
    minz:
      paths: [minz/src/tim1_motor_pwm.rs, minz/src/am32_timers.rs, minz/src/tim6_loop.rs]
      qualification: "One L431 implementation uses TIM1 for PWM/phase, TIM2 as interval timer, TIM16 as commutation timer, and TIM6 as periodic loop."
    rm32:
      paths:
        - rm32_stm32/src/phase.rs
        - rm32_stm32/src/timer.rs
        - rm32_stm32/src/mcu_l431/pwm.rs
        - rm32_stm32/src/mcu_l431/init.rs
      qualification: "The L431 arrangement is equivalent, behind shared drivers and family-specific setup; other families supply parallel adapters."
    evidence:
      - "minz/src/lib.rs:20-40"
      - "minz/examples/am32_clone.rs:531-541"
      - "rm32_stm32/src/mcu_l431/chip.rs:76-83"
      - "rm32_stm32/src/mcu_l431/init.rs:100-168"

  - id: interrupt_contexts
    relationship: partial
    audit_qualification: COMP, commutation, and TIM6 correspond directly. MinZ USART2 RX and rm32 DMA/frame-processing EXTI are one-sided active contexts; CRSF is only a callable unwired handler.
    minz:
      paths: [minz/examples/am32_clone.rs, minz/core/src/am32_isr.rs]
      qualification: "Four explicit vectors/contexts: COMP, TIM16-on-TIM1_UP, TIM6, and USART2 RX."
    rm32:
      paths:
