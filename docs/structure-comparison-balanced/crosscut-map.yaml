contradictions_and_risks:
  - id: rm32_isr_cell_preemption_unsoundness
    severity: critical
    side: rm32
    finding: "IsrCell's unsafe Sync invariant says every ISR touching ISR_LOCAL has the same priority and cannot preempt another, but L431 explicitly assigns different priorities and dynamically swaps DMA versus COMP/commutation. handle_tim6, handle_tim14, handle_comp, handle_dma_tc, and handle_exti_frame all call ISR_LOCAL.get(), so nested mutable access is possible."
    evidence:
      - "rm32_stm32/src/isr_handlers.rs:12-39"
      - "rm32_stm32/src/isr_handlers.rs:71-82"
      - "rm32_stm32/src/isr_handlers.rs:105-129"
      - "rm32_stm32/src/isr_handlers.rs:148-180"
      - "rm32_stm32/src/mcu_l431/init.rs:219-249"
      - "rm32_stm32/src/mcu_l431/chip.rs:43-73"

  - id: rm32_non_l431_comp_ack_gap
    severity: high
    side: rm32
    finding: "Portable bemf_zero_cross documents that an early persistence reject requires platform acknowledgement at ISR entry; it states only L431 does so. Current F051/G071/G431 vector wrappers call handle_comp directly without an explicit pending-bit clear/mask."
    evidence:
      - "rm32/src/control/isr_logic.rs:268-280"
      - "rm32_stm32/src/mcu_l431/interrupts.rs:27-49"
      - "rm32_stm32/src/mcu_f051/interrupts.rs:22-25"
      - "rm32_stm32/src/mcu_g071/interrupts.rs:18-21"
      - "rm32_stm32/src/mcu_g431/interrupts.rs:26-29"

  - id: minz_kill_latch_is_cleared_by_reporting
    severity: high
    side: minz
    finding: "The firmware labels KILLED a latched fatal kill, and TIM6 suppresses duty only while it is true, but foreground reporting uses swap(false). The safety routine also leaves UART duty input intact, so after reporting a hard kill the control path can become eligible to restart."
    evidence:
      - "minz/examples/am32_clone.rs:149-153"
      - "minz/examples/am32_clone.rs:420-429"
      - "minz/core/src/am32_control.rs:182-204"
      - "minz/core/src/am32_isr.rs:147-158"

  - id: rm32_save_settings_config_copy_divergence
    severity: medium
    side: rm32
    finding: "DShot command processing mutates IsrState.config, but the foreground save path writes MainState.config; the code explicitly marks the synchronization as TODO."
    evidence:
      - "rm32_stm32/src/isr_handlers.rs:276-307"
      - "rm32_stm32/src/bin/main.rs:433-440"

  - id: rm32_debug_behavior_differs_from_declared_product_behavior
    severity: medium
    side: rm32
    finding: "The current firmware overrides multiple EEPROM behaviors, disables IWDG startup, and suppresses signal-timeout reset. Reports must describe these capabilities as present but not currently exercised as production behavior."
    evidence:
      - "rm32_stm32/src/bin/main.rs:121-125"
      - "rm32_stm32/src/bin/main.rs:209-218"
      - "rm32_stm32/src/bin/main.rs:451-466"

  - id: rm32_crsf_has_no_vector_wiring
    severity: medium
    side: rm32
    finding: "CRSF parser state and a shared handler exist, but no MCU interrupt or foreground call reaches handle_crsf_byte; it is library/handler-only in the current firmware."
    evidence:
      - "rm32_stm32/src/isr.rs:70-88"
      - "rm32_stm32/src/isr_handlers.rs:369-382"

  - id: minz_dormant_adc_dma_footprint
    severity: low
    side: minz
    finding: "adc_sync reserves and configures a 4 KiB regular-current DMA ring, but explicitly never starts the regular conversion in am32_clone. It is configured storage, not an active diagnostic stream."
    evidence:
      - "minz/src/adc_sync.rs:50-55"
      - "minz/src/adc_sync.rs:114-132"
      - "minz/src/adc_sync.rs:149-160"

  - id: host_tests_do_not_cover_platform_concurrency_and_register_contracts
    severity: structural
    side: both
    finding: "Both test portable logic with mocks, but vector/unit success cannot prove DMA address stability, pin mapping, EXTI acknowledgement, interrupt nesting, register timing, or analog behavior."
    evidence:
      - "minz/core/src/lib.rs:4-13"
      - "rm32/src/bin/harness.rs:23-35"
      - "rm32/src/system.rs:153-172"
      - "rm32_stm32/src/isr_handlers.rs:12-69"

  - id: minz_panic_does_not_force_bridge_off
    severity: high
    side: minz
    finding: MinZ safety_kill forces phases off, but panic disables interrupts and waits for IWDG reset without an explicit emergency bridge-off write.
    evidence:
      - minz/core/src/am32_control.rs:182-204
      - minz/src/panic.rs:45-71

  - id: minz_relaxed_multi_field_state
    severity: medium
    side: minz
    finding: Independent Relaxed atomics are race-free per field but do not form coherent multi-field snapshots; correctness depends on single-core access sequencing.
    evidence:
      - minz/core/src/am32_loop.rs:74-145
      - minz/core/src/am32_isr.rs:43-159

  - id: rm32_board_feature_mismatch_not_enforced
    severity: medium
    side: rm32
    finding: build.rs derives an expected target feature from BOARD but does not reject a mismatch, so generated board data and the compiled MCU family can diverge.
    evidence:
      - rm32_stm32/build.rs:306-315

  - id: rm32_generated_board_fields_unconsumed
    severity: medium
    side: rm32
    finding: current_adc_channel, voltage_adc_channel, dual_adc, and custom_led are generated but have no runtime consumers; not every YAML field currently drives an adapter.
    evidence:
      - rm32/src/board.rs:38-62
      - rm32_stm32/build.rs:264-276

conclusions:
  balanced_inventory_result:
    - "The overlap is deep in six-step AM32 motor timing and the core motor HAL, not in the surrounding product surface."
    - "MinZ-only items are primarily bench command, trace, pre-fault evidence, synchronized observer sampling, and actively enforced wedge containment."
    - "rm32-only items are primarily protocol breadth, persistent/configurable product behavior, multi-target adapters, optional motor modes, and process-vector verification."
    - "Presence and wiring must remain separate: rm32's CRSF/DroneCAN/brushed/fixed/watchdog paths and MinZ's regular ADC DMA ring are not active equivalents."
  confidence: high
