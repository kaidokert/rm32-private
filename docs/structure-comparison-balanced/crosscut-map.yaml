runtime_flow_correspondence:
  boot_and_wiring:
    minz:
      flow:
        - "Take L431 peripherals and configure one fixed clock/pin layout."
        - "Initialize comparator, TIM1 PWM, injected ADC, TIM2/TIM16/TIM6, active IWDG, USART2 RX, USART1 DMA TX."
        - "Install static priority levels and enter main_entry."
      evidence:
        - "minz/examples/am32_clone.rs:460-579"
    rm32:
      flow:
        - "Generate BOARD at build time, initialize feature-selected MCU peripherals, LED and startup sound."
        - "Load/migrate EEPROM, derive motor settings, build ISR-exclusive and main-exclusive state."
        - "Move ISR state static, arm input DMA, enable interrupts, enter foreground loop."
      evidence:
        - "rm32_stm32/src/bin/main.rs:28-167"
        - "rm32_stm32/src/bin/main.rs:169-270"
  input_to_setpoint:
    minz:
      flow:
        - "USART2 ISR pushes bytes to an atomic ring."
        - "Foreground parser updates UART duty/input and bench request atomics."
        - "Foreground set_input maps UART throttle to setpoint; TIM6 ramps and applies it."
      evidence:
        - "minz/examples/am32_clone.rs:240-256"
        - "minz/examples/am32_clone.rs:366-375"
        - "minz/core/src/am32_isr.rs:147-158"
    rm32:
      flow:
        - "DMA input capture and EXTI frame processing detect/decode DShot or servo and publish newinput."
        - "SystemTick input mapping publishes adjusted_input."
        - "TIM6 computes, ramps, clamps, and applies duty."
      evidence:
        - "rm32_stm32/src/isr_handlers.rs:177-239"
        - "rm32_stm32/src/isr_handlers.rs:242-335"
        - "rm32/src/system.rs:32-47"
        - "rm32/src/control/isr_logic.rs:64-167"
  polling_startup:
    minz:
      flow:
        - "TIM6 polls comparator while old_routine and running; accepted BEMF calls zcfoundroutine and either immediate or scheduled commutation."
      evidence:
        - "minz/core/src/am32_isr.rs:180-205"
    rm32:
      flow:
        - "TIM6 masks/reads comparator, updates BemfState, advances directly for early crossings or arms commutation timer."
      evidence:
        - "rm32/src/control/isr_logic.rs:182-213"
  interrupt_closed_loop:
    minz:
      flow:
        - "COMP gates by half average interval and persistence, timestamps and arms TIM16."
        - "TIM16 commutates, blends timing, computes advance/wait, writes trace, and re-enables comparator."
      evidence:
        - "minz/core/src/am32_isr.rs:37-92"
        - "minz/core/src/am32_isr.rs:100-129"
    rm32:
      flow:
        - "COMP persistence acceptance records timing and arms commutation timer."
        - "Commutation handler advances, updates timing, publishes desync flag, and re-enables comparator."
      evidence:
        - "rm32/src/control/isr_logic.rs:217-266"
        - "rm32/src/control/isr_logic.rs:268-298"
  foreground:
    minz:
      flow:
        - "Refresh watchdog; parse bench UART; compute schedule/desync/timeout; drain trace; service requests."
      evidence:
        - "minz/examples/am32_clone.rs:366-388"
    rm32:
      flow:
        - "Run optional sine step; SystemTick input/sync/main pipeline; update LED, IRQ priorities, EEPROM, info response, reset/watchdog/logging."
      evidence:
        - "rm32_stm32/src/bin/main.rs:379-481"

