schema_version: 1
inventory:
  side: minz
  subject: "current minz-core plus the STM32L431 am32_clone firmware"
  generated_from: "working tree on 2026-07-23"
  evidence_policy:
    - "Only current files in the balanced scope are implementation evidence."
    - "Historical docs/structure-comparison artifacts were not used."
    - "A module's presence is distinct from whether am32_clone calls it."
  scope:
    source_roots:
      - minz/core/src
      - minz/src
      - minz/examples
    build_and_configuration:
      - minz/Cargo.toml
      - minz/core/Cargo.toml
      - minz/build.rs
      - minz/memory.x
      - minz/.cargo/config.toml
      - minz/core/.cargo/config.toml
    excluded:
      - "minz/Cargo.lock and minz/core/Cargo.lock: resolved dependency locks, not manifests or implementation."
      - "minz/scripts, captures, notes, images, and prose studies: outside the balanced implementation surface."
      - "generated minz/target and minz/core/target trees."

report_metadata:
  semantic_reconciliation: docs/structure-comparison-balanced/audit-minz.yaml
  reconciled_on: "2026-07-23"
  required_carry_forward:
    - "Do not describe the L431 linker layouts as interchangeable: MinZ starts at 0x08000000 with 256 KiB, while rm32_stm32 starts its application at 0x08001000 and exposes a 58 KiB flash region around reserved bootloader/EEPROM boundaries."
    - "Treat rm32's debug-frame history and bounded wait helper as partial counterparts while preserving MinZ's exact distinct deltas."
    - "Treat rm32 CRSF as a partial serial-parser/handler concept, not an active counterpart to MinZ's wired ASCII UART duty channel."
  evidence:
    - "minz/memory.x:1-5"
    - "rm32_stm32/memory.x:1-16"
    - "rm32_stm32/src/dbg_frame_history.rs:1-50"
    - "rm32_stm32/src/regs.rs:1-35"
    - "rm32/src/crsf.rs:60-145"

