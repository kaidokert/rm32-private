runtime_flows:
  boot:
    sequence:
      - "Acquire Cortex/PAC peripherals; set 80 MHz clock, prefetch, and RTT."
      - "Configure GPIO, USART2 command RX, ADC calibration, motor pins, USART1 diagnostic TX, COMP2/EXTI, TIM1 PWM, injected ADC, TIM2/TIM16/TIM6, and IWDG."
      - "Seed a zero-duty commutation role and comparator mux, leave comparator EXTI masked, then install priorities COMP=0, COM=0, USART2=2, TIM6=3."
      - "Enable interrupts and enter the foreground loop."
    evidence:
      - "minz/examples/am32_clone.rs:460-579"
  foreground:
    sequence:
      - "Refresh IWDG, drain RX bytes through UartDuty, and honor stop requests."
      - "Compute six-sector timing sum; apply input/arming, BEMF threshold schedule, variable carrier, average/desync/filter maps, and BEMF-timeout re-kick."
      - "Drain at most three ZC_TRACE records, service DMA TX, and emit requested info/black-box/kill dumps."
    evidence:
      - "minz/examples/am32_clone.rs:345-388"
      - "minz/examples/am32_clone.rs:391-457"
  comparator_event:
    sequence:
      - "COMP checks EXTI22 pending and half-average-interval gate."
      - "A pre-ZC level is cleared while a post-ZC pending edge camps until the gate opens."
      - "Persistence samples must all remain post-ZC; then comparator interrupts are masked, timestamps rotate, interval timer resets, and TIM16 is armed."
    evidence:
      - "minz/core/src/am32_isr.rs:33-92"
  commutation_event:
    sequence:
      - "TIM16 update is acknowledged and disabled."
      - "Step/phase roles/comparator mux rotate; interval estimate blends last and current ZC; advance/wait update."
      - "ZC_TRACE records, comparator interrupts re-enable in interrupt mode, and zero-cross count increments."
    evidence:
      - "minz/core/src/am32_isr.rs:95-129"
      - "minz/core/src/am32_control.rs:38-82"
  periodic_control:
    cadence: "TIM6 PSC=79, ARR=50: approximately 19.6 kHz despite AM32's 20 kHz nominal constant"
    sequence:
      - "Acknowledge timer, ramp and apply duty unless killed."
      - "During old_routine, poll comparator and synchronously run zcfoundroutine when persistence count exceeds its direction-specific threshold."
      - "Tick UART deadman, harvest injected current/vbat, and latch hard overcurrent/undervoltage kills."
    evidence:
      - "minz/src/tim6_loop.rs:1-5"
      - "minz/core/src/am32_isr.rs:131-159"
      - "minz/core/src/am32_isr.rs:180-239"
  uart_receive_event:
    sequence:
      - "USART2 RX ISR enqueues bytes to a drop-newest atomic SPSC ring."
      - "Foreground parses ASCII percentage/permille commands and the stop/trace/info/black-box keys."
    evidence:
      - "minz/src/usart2_rx.rs:32-51"
      - "minz/core/src/am32.rs:350-480"
      - "minz/examples/am32_clone.rs:391-398"

state_ownership_and_communication:
  ownership:
    - "Cross-context control/ring storage is predominantly module-level AtomicBool/U16/U32/Usize arrays plus one critical-section BlackBox cell."
    - "Sched, Drive, Duty, Bench, RxRing, and ZctTrace are borrowed-reference cohesion views; each ISR reconstructs zero-sized Motor and Observer bundles rather than owning a persistent context."
    - "Foreground-only UartDuty state, UartTxWriter ownership/indices, and main's 4 KiB static-local TX buffer are non-atomic; calibrated SenseAdc is retained as an unused ownership guard."
  cross_context:
    - channel: "control and estimator state"
      mechanism: "direct Relaxed atomic loads/stores through borrowed clusters"
      participants: "foreground, COMP, TIM16, TIM6"
    - channel: "command input"
      mechanism: "USART2 ISR producer / foreground consumer atomic SPSC ring; newest byte drops on full"
      participants: "USART2 ISR -> foreground"
    - channel: "ZC_TRACE"
      mechanism: "critical-section guarded atomic record ring with two ISR producer contexts and foreground consumer; oldest record drops on full"
      participants: "TIM16 and TIM6/polling path -> foreground"
    - channel: "black box"
      mechanism: "cortex_m interrupt Mutex<RefCell<BlackBox>>"
      participants: "all control contexts -> foreground dump"
  contrast_with_rm32:
    relationship: partial
    summary: "rm32 separates owned main and ISR contexts and communicates actions/data through explicit shared structures/mailboxes; MinZ exposes one atomic state graph directly to every band."
  evidence:
    - "minz/examples/am32_clone.rs:108-169"
    - "minz/examples/am32_clone.rs:243-326"
    - "minz/examples/am32_clone.rs:345-356"
    - "minz/examples/am32_clone.rs:461-463"
    - "minz/examples/am32_clone.rs:558-560"
    - "minz/src/uart_tx.rs:41-81"
    - "minz/core/src/am32_loop.rs:74-145"
    - "minz/core/src/am32.rs:444-533"
    - "minz/src/bb.rs:9-35"

