      - "minz/core/src/am32_loop.rs:74-145"
      - "minz/core/src/am32_isr.rs:43-159"
  - id: interrupt_priority_aliasing
    statement: "COMP and TIM16 share logical priority 0 and therefore cannot preempt each other; TIM6 and USART2 may be preempted. Critical sections are still used for multi-producer trace and acceptance updates."
    evidence:
      - "minz/examples/am32_clone.rs:562-574"
      - "minz/core/src/zct_trace.rs:65-68"
  - id: observer_adc_scope
    statement: "Injected phase A/B samples are harvested but discarded by the active core; only current and vbat feed telemetry/safety, and thresholds are raw bench constants."
    evidence:
      - "minz/core/src/am32_isr.rs:211-239"
  - id: safety_scope
    statement: "No thermal protection, configuration-backed current model, persistent fault storage, or reset-cause reporting exists in this current MinZ surface."
    evidence:
      - "minz/core/src/am32_isr.rs:25-30"
      - "minz/examples/am32_clone.rs:149-159"
  - id: panic_bridge_state
    statement: "The panic handler does not explicitly force the bridge off before waiting for IWDG reset."
    evidence:
      - "minz/src/panic.rs:45-71"
  - id: dormant_load_bearing_adc
    statement: "The retained unstarted ADC regular-group/DMA setup and 4 KiB ring have an observed correlation with bench behavior but no established mechanism, limiting architectural confidence."
    evidence:
      - "minz/src/adc_sync.rs:1-20"
  - id: stale_residue
    statement: "Two comments mention deleted motor_tester2, and the black-box event catalog retains unused older-controller events; these are documentation/residual-surface issues, not active firmware modules."
    evidence:
      - "minz/examples/am32_clone.rs:100-102"
      - "minz/src/tim1_motor_pwm.rs:348-353"
      - "minz/core/src/blackbox.rs:79-115"
  - id: verification_boundary
    statement: "Host tests validate portable behavior and target cargo check validates compilation, but neither establishes real-time/electrical correctness or target runtime safety."
    evidence:
      - "minz/core/src/am32_hal.rs:1-10"

