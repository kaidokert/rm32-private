    runtime_context: "main/foreground, periodic ISR, event ISR"
    counterpart:
      path: "rm32/src/functions.rs; rm32/src/input_mapping.rs; rm32/src/shared_comm.rs"
      relationship: partial
      why: "rm32 has equivalent mapping/control math and explicit cross-context communication, but not MinZ's AM32-fork ASCII parser or ZC_TRACE wire-ring implementation."
