corrections:
  - id: intended_memory_counterpart_path
    severity: mechanical
    applies_to: "modules[minz/memory.x].counterpart"
    current: rm32_stm32/memory.x
    corrected: rm32_stm32/memory.x
    reason: "Only rm32_stm32/memory.x exists."
    evidence:
      - "minz/memory.x:1-5"
      - "rm32_stm32/memory.x:1-16"

  - id: intended_target_config_counterpart_path
    severity: mechanical
    applies_to: "modules[minz/.cargo/config.toml].counterpart"
    current: .cargo/config.toml
    corrected: rm32_stm32/Cargo.toml
    reason: "There is no repository-root .cargo/config.toml; the requested balanced counterpart is rm32_stm32's target/feature manifest."
    evidence:
      - "minz/.cargo/config.toml:1-6"
      - "rm32_stm32/Cargo.toml:1-52"

  - id: am32_timers_periodic_context
    severity: minor
    applies_to: "modules[minz/src/am32_timers.rs].runtime_context"
    current: "main/foreground, event ISR"
    corrected: "main/foreground, periodic ISR, event ISR"
    reason: "TIM6 polling-mode BEMF acceptance calls interval and commutation-timer operations through Am32Timers."
    evidence:
      - "minz/core/src/am32_isr.rs:183-212"
      - "minz/core/src/am32_control.rs:91-157"
      - "minz/src/am32_timers.rs:117-158"

  - id: comp2_periodic_context
    severity: minor
    applies_to: "modules[minz/src/comp2.rs].runtime_context"
    current: "main/foreground, event ISR"
    corrected: "main/foreground, periodic ISR, event ISR"
    reason: "TIM6 polls Comparator::output_level and its synchronous zcfoundroutine can rotate the comparator input."
    evidence:
      - "minz/core/src/am32_isr.rs:183-212"
      - "minz/core/src/am32_control.rs:132-157"
      - "minz/src/comp2.rs:324-368"

  - id: state_storage_overstatement
    severity: material
    applies_to: state_ownership_and_communication.ownership
    current: "The program owns all mutable runtime storage as module-level atomics and one critical-section BlackBox cell."
    corrected: "Cross-context control/ring storage is predominantly module-level atomics plus one critical-section BlackBox; foreground-only parser, UART writer indices/ownership, and the 4 KiB TX buffer are non-atomic local/static-local state."
    reason: "The existing sentence is contradicted by UartDuty, UartTxWriter's mutable fields, and main's static-local TX_RING."
    evidence:
      - "minz/examples/am32_clone.rs:345-356"
      - "minz/examples/am32_clone.rs:461-463"
      - "minz/examples/am32_clone.rs:558-560"
      - "minz/src/uart_tx.rs:41-81"

  - id: blackbox_counterpart_relationship
    severity: material
    applies_to:
      - "modules[minz/core/src/blackbox.rs].counterpart"
      - "modules[minz/src/bb.rs].counterpart"
      - "side_only_capabilities[on-target black box].rm32_counterpart"
    current: none
    corrected: partial
    reason: "rm32's feature-gated dbg_frame_history is also an on-target fixed history ring written from ISR context and read chronologically in main. MinZ remains distinct because it records motor-control events, holds 64 entries, freezes on safety kill, timestamps entries, and formats text replay."
    evidence:
      - "minz/core/src/blackbox.rs:1-66"
      - "minz/src/bb.rs:9-35"
      - "rm32_stm32/src/dbg_frame_history.rs:1-50"
      - "rm32_stm32/src/isr_handlers.rs:358-365"
      - "rm32_stm32/src/bin/main.rs:348-358"

  - id: bounded_spin_counterpart_relationship
    severity: material
    applies_to:
      - "modules[minz/src/spin.rs].counterpart"
      - "side_only_capabilities[shared bounded hardware spin].rm32_counterpart"
    current: none
    corrected: partial
    reason: "rm32_stm32::regs::wait_for is a shared bounded hardware-wait abstraction. MinZ's differentiator is the cumulative global timeout counter and continue-after-timeout boolean API, not the existence of bounded waiting itself."
    evidence:
      - "minz/src/spin.rs:1-32"
      - "rm32_stm32/src/regs.rs:1-35"

  - id: uart_rx_counterpart_context
    severity: minor
    applies_to: "modules[minz/src/usart2_rx.rs].counterpart"
    current: "capture_hal/debug_uart with relationship none"
    corrected: "retain none for an active ASCII-throttle hardware channel, but cite rm32/src/crsf.rs and rm32_stm32/src/isr_handlers.rs as a partial serial-parser/handler concept and state that current rm32 has no wired UART RX vector/adapter"
    reason: "The active protocol remains MinZ-only, but omitting rm32's byte-fed CRSF parser and handler makes the structural mapping less balanced."
    evidence:
      - "minz/src/usart2_rx.rs:12-51"
      - "rm32/src/crsf.rs:60-145"
      - "rm32_stm32/src/isr_handlers.rs:369-381"

  - id: memory_layout_difference
    severity: material
    applies_to: "modules[minz/memory.x].counterpart.why and final report"
    current: "Both provide L431 linker geometry."
    corrected: "Both are L431 linker maps, but MinZ links at 0x08000000 across 256 KiB while rm32_stm32 reserves a 4 KiB bootloader and EEPROM boundary and links the app at 0x08001000 with a 58 KiB flash region."
    reason: "Calling the relationship direct without the address-space difference would conceal an operationally important target-layout divergence."
    evidence:
      - "minz/memory.x:1-5"
      - "rm32_stm32/memory.x:1-16"

  - id: stale_source_comment_scope
    severity: minor
    applies_to:
      - diagnostics_serialization_and_tooling.stale_or_residual
      - limitations.stale_residue
    current: "Residual notes cover old black-box event codes and two motor_tester2 mentions."
    corrected: "Also flag comp2's stale module header claiming no EXTI/interrupt use, spin.rs claiming its timeout count appears in info output, iwdg.rs referring to a removed 'u' UART blast, and tim6_loop's already-finished TIM7 migration narrative."
    reason: "Executable wiring is correctly inventoried, but these source comments can mislead consolidation if treated as current behavior."
    evidence:
      - "minz/src/comp2.rs:1-16"
      - "minz/src/comp2.rs:194-256"
      - "minz/src/spin.rs:12-15"
      - "minz/examples/am32_clone.rs:433-448"
      - "minz/src/iwdg.rs:10-13"
      - "minz/core/src/am32.rs:350-442"
      - "minz/src/tim6_loop.rs:7-12"

