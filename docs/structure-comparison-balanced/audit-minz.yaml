report_guidance:
  required:
    - "Use all 31 rows in the MinZ inventory; do not collapse diagnostics, build configuration, or internally dormant surfaces out of the side-by-side module table."
    - "Show module-level wiring separately from sub-features: adc_sync and tim1_motor_pwm are active modules containing declared-unwired operations."
    - "Present MinZ as a dependency-free portable brain plus a single fixed L431 adapter/composition image, contrasted with rm32's broader core/platform/target-family configuration."
    - "Describe the state model precisely: a shared Relaxed-atomic control graph across foreground and ISRs, plus foreground-local UART state and a mutex-protected black box."
    - "Use partial, not absent, for rm32's debug frame history and bounded wait helper; emphasize the exact MinZ-only deltas."
    - "Keep active-protocol asymmetry explicit: MinZ's active ASCII UART duty/bench channel versus rm32's active DShot/servo path and library/handler-level CRSF support."
    - "Call out the incompatible linker placement: MinZ starts at flash base with 256 KiB available; rm32 reserves bootloader/EEPROM regions and links the app at 0x08001000."
    - "Separate safety mechanism presence from wiring: MinZ IWDG is active; rm32 watchdog support exists but normal-main startup is currently disabled."
    - "State that MinZ's black box freezes specifically on the OC/undervoltage safety-kill path, not on every desync or generic fault."
    - "Treat stale source comments as residue, not behavior; executable call sites and vector wiring control the report."
    - "Preserve verification limits: 77 host tests and a target cargo check do not establish runtime/electrical correctness."
  avoid:
    - "Do not say rm32 has no on-target history ring."
    - "Do not say rm32 has no shared bounded wait abstraction."
    - "Do not imply MinZ and rm32 use the same L431 flash geometry."
    - "Do not imply every MinZ mutable byte is module-level atomic state."
    - "Do not infer that every public method inside an active MinZ module is actively called."

final_audit_assertion:
  inventory_is_exhaustive_at_file_level: true
  inventory_is_balanced_enough_for_consolidation: true
  conditions:
    - "Carry forward the two intended citation-path fixes."
    - "Apply or explicitly reflect the semantic/counterpart corrections in consolidation."
  unresolved_unknowns:
    - "The mechanism behind adc_sync's dormant regular-group/DMA layout correlation remains empirically observed but unexplained."
    - "No static inspection or cargo check proves real-time priority behavior, analog sampling validity, gate-drive safety, or motor operation."
