  - rm32_stm32/boards/neutron_l431.yaml:1
  - rm32_stm32/boards/protondrive_g431.yaml:1
- layer: build generation
  description: BOARD selects YAML; build.rs validates MCU-specific comparator pin encodings and writes BoardConfig into OUT_DIR.
  evidence:
  - rm32_stm32/build.rs:1
  - rm32_stm32/build.rs:197
  - rm32_stm32/build.rs:241
- layer: Cargo feature
  description: The MCU feature still must match the YAML; build.rs only emits BOARD_MCU metadata and does not activate Cargo features.
  evidence:
  - rm32_stm32/build.rs:306
  - rm32_stm32/Cargo.toml:41
