safety_observability_serialization_and_tooling:
- area: motor protections
  description: Signal timeout, BEMF/stuck rotor, desync, low-voltage, firmware-reachable current/stall PID, and internal-temperature limiting
    exist in portable logic; speed PID is harness-enabled only and external NTC is dormant for all current boards.
  evidence:
  - rm32/src/control/input.rs:60
  - rm32/src/main_state.rs:291
  - rm32/src/main_state.rs:474
  - rm32/src/bin/harness.rs:675
  - rm32/src/main_state.rs:432
- area: hard fault response
  description: Panic and HardFault force phases off through direct GPIO before logging.
  evidence:
  - rm32_stm32/src/panic.rs:21
  - rm32_stm32/src/emergency.rs:12
- area: observability
  description: Reset-cause reporting, RTT/debug-UART loop metrics, atomic ISR counters, and optional decoded-frame history are wired; there is
    no MinZ-style control-event black box.
  evidence:
  - rm32_stm32/src/bin/main.rs:63
  - rm32_stm32/src/bin/main.rs:317
  - rm32_stm32/src/dbg_frame_history.rs:19
- area: serialization
  description: EEPROM is byte-cast with bytemuck; DShot GCR, EDT, KISS telemetry, ESC-info, and WS2812 each have explicit encoders.
  evidence:
  - rm32/src/config.rs:18
  - rm32/src/dshot.rs:116
  - rm32/src/telemetry.rs:22
  - rm32/src/ws2812.rs:1
- area: host tooling
  description: A process harness exposes configuration, ticking, state, EEPROM load, and GCR encoding to a Python vector DSL.
  evidence:
  - rm32/src/bin/harness.rs:745
  - tests/blackbox/harness.py:144
  - tests/blackbox/test_vectors.py:43
host_tests_target_builds_and_runtime_verification_boundaries:
- boundary: Rust unit/integration
  description: Portable modules contain host tests; control integration tests execute the production isr_logic path.
  evidence:
  - rm32/src/control/tests.rs:1
  - rm32/src/control/tests.rs:7
- boundary: process black-box
  description: Every .txt vector is auto-discovered and run against rm32_harness; no xfails are currently declared.
  evidence:
  - tests/blackbox/test_vectors.py:27
  - tests/blackbox/test_vectors.py:40
  - tests/blackbox/test_vectors.py:43
- boundary: target compilation
  description: Cargo features make four MCU code paths compilable, but a successful cross-build does not prove electrical behavior, ISR latency,
    DMA timing, or board-pin correctness.
  evidence:
  - rm32_stm32/Cargo.toml:41
  - rm32_stm32/src/mcu.rs:24
- boundary: bench firmware current state
  description: Current main explicitly disables the watchdog, clears several protections/modes for bench work, suppresses signal-timeout reset,
    and logs heavily; those source facts limit production-safety claims.
  evidence:
  - rm32_stm32/src/bin/main.rs:123
  - rm32_stm32/src/bin/main.rs:218
  - rm32_stm32/src/bin/main.rs:317
  - rm32_stm32/src/bin/main.rs:459
- boundary: observed current host results
  description: cargo test -p rm32 passed 253 tests. With AM32_HARNESS explicitly pointed to target/release/rm32_harness.exe, pytest passed 77
    cases and failed temperature_limit because duty_cycle_maximum remained 2000.
  evidence:
  - tests/blackbox/vectors/temperature_limit.txt:1
  - tests/blackbox/harness.py:21
  - tests/blackbox/test_vectors.py:43
