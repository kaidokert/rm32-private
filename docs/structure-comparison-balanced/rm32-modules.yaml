limitations_and_uncertainty:
- issue: Current firmware entry is bench-modified rather than production-safe.
  impact: Source disables watchdog start, clears stuck/stall/bidirectional/sine/brake settings, suppresses signal-timeout reset, and emits frequent
    diagnostics.
  evidence:
  - rm32_stm32/src/bin/main.rs:123
  - rm32_stm32/src/bin/main.rs:218
  - rm32_stm32/src/bin/main.rs:317
  - rm32_stm32/src/bin/main.rs:459
- issue: Comparator pending-bit handling is explicitly incomplete on F051/G071/G431.
  impact: The portable ISR warns early return can cause an ISR storm and says only L431 currently acknowledges at wrapper entry.
  evidence:
  - rm32/src/control/isr_logic.rs:270
  - rm32/src/control/isr_logic.rs:276
- issue: 'Critical current soundness risk: IsrCell can create cross-interrupt mutable aliasing on STM32L431.'
  severity: critical_current_risk
  impact: All motor/input handlers obtain &mut TargetIsrState from one UnsafeCell, while L431 priorities explicitly permit COMP, commutation,
    DMA, and EXTI handlers to preempt TIM6 and dynamic priority swapping preserves unequal priorities. Preemption can therefore overlap mutable
    references, violating Rust aliasing requirements.
  evidence:
  - rm32_stm32/src/isr_handlers.rs:16
  - rm32_stm32/src/isr_handlers.rs:82
  - rm32_stm32/src/isr_handlers.rs:107
  - rm32_stm32/src/isr_handlers.rs:129
  - rm32_stm32/src/isr_handlers.rs:150
  - rm32_stm32/src/isr_handlers.rs:180
  - rm32_stm32/src/mcu_l431/init.rs:219
  - rm32_stm32/src/mcu_l431/init.rs:245
  - rm32_stm32/src/mcu_l431/chip.rs:51
- issue: Save-settings command propagation is incomplete.
  impact: Main acknowledges that ISR mutates its own config copy and changed fields are not published for correct persistence.
  evidence:
  - rm32_stm32/src/bin/main.rs:433
- issue: CRSF and DroneCAN are presence-only.
  impact: CRSF has parser/handler but no target RX-vector call; DroneCAN appears only as an optional dependency/feature.
  evidence:
  - rm32_stm32/src/isr_handlers.rs:370
  - rm32/Cargo.toml:10
  - rm32/Cargo.toml:21
- issue: Board-feature consistency is not automatically enforced.
  impact: build.rs computes expected feature only informationally; a mismatched BOARD path and Cargo feature can reach target-specific assumptions.
  evidence:
  - rm32_stm32/build.rs:306
- issue: Host vectors abstract away hardware concurrency and timing.
  impact: Mock HAL counters and synchronous ticks prove logic behavior, not DMA races, analog BEMF quality, interrupt latency, dead time, or actual
    phase switching.
  evidence:
  - rm32/src/bin/harness.rs:25
  - rm32/src/bin/harness.rs:187
  - tests/blackbox/harness.py:40
- issue: Target-family code was inventoried from source, not electrically exercised in this wave.
  impact: Wiring classification means reachable in the selected feature path, not bench validation on all fourteen boards.
  evidence:
  - rm32_stm32/src/mcu.rs:24
  - rm32_stm32/boards/flycolor_g071.yaml:1
- issue: Several generated board fields are not consumed by current firmware.
  impact: current_adc_channel, voltage_adc_channel, dual_adc, and custom_led are emitted into BoardConfig but have no source reads outside their
    definitions; per-chip ADC code therefore does not honor those YAML values through BoardConfig.
  evidence:
  - rm32/src/board.rs:38
  - rm32/src/board.rs:62
  - rm32_stm32/build.rs:264
  - rm32_stm32/build.rs:276
  - rm32_stm32/src/mcu.rs:15
- issue: Default black-box harness executable discovery is not Windows-extension aware.
  impact: harness.py checks target/release/rm32_harness without .exe, then falls back to build/am32_harness; on Windows the suite needs AM32_HARNESS
    set explicitly despite a successful Cargo build.
  evidence:
  - tests/blackbox/harness.py:21
  - tests/blackbox/harness.py:24
  - tests/blackbox/harness.py:27
