schema_version: 1
review:
  side: rm32
  basis: fresh current-working-tree inspection; historical structure-comparison evidence excluded
  generated_from_commit: working tree (including user changes)
  scope_count: 211
  presence_vs_wiring_rule: A file's existence proves declared capability only. Active wiring requires a call path from the selected firmware entry/vector.
crate_package_topology:
- component: workspace
  description: Root workspace builds rm32 by default and explicitly excludes rm32_stm32 because firmware requires an ARM target.
  evidence:
  - Cargo.toml:1
  - Cargo.toml:5
- component: rm32
  description: Portable no_std library plus rm32_harness host binary; optional DroneCAN dependency is declared but no source module consumes it.
  evidence:
  - rm32/Cargo.toml:1
  - rm32/Cargo.toml:13
  - rm32/Cargo.toml:18
- component: rm32_stm32
  description: Separate no_std firmware package with one feature-selected STM32 family (F051, G071, G431, or L431).
  evidence:
  - rm32_stm32/Cargo.toml:1
  - rm32_stm32/Cargo.toml:41
  - rm32_stm32/src/lib.rs:54
runtime_interrupt_flows:
- name: boot_and_foreground
  flow: entry -> board/MCU init -> load config -> split MainState and IsrState -> install ISR state -> arm input DMA -> enable IRQ -> free-running
    main loop -> sine tick + SystemTick::run_tick + persistence/info actions
  evidence:
  - rm32_stm32/src/bin/main.rs:35
  - rm32_stm32/src/bin/main.rs:89
  - rm32_stm32/src/bin/main.rs:137
  - rm32_stm32/src/bin/main.rs:259
  - rm32_stm32/src/bin/main.rs:273
  - rm32_stm32/src/bin/main.rs:381
  - rm32_stm32/src/bin/main.rs:407
- name: periodic_control
  flow: target TIM6 vector -> handle_tim6 -> MotorContext -> ten_khz_tick -> shared outputs/PWM
  evidence:
  - rm32_stm32/src/isr_handlers.rs:72
  - rm32_stm32/src/isr_handlers.rs:95
  - rm32/src/control/isr_logic.rs:19
- name: zero_cross_commutation
  flow: comparator EXTI -> handle_comp -> portable bemf_zero_cross -> arm one-shot commutation timer -> target TIM14/TIM16 vector -> handle_tim14
    -> commutation_timer_expired
  evidence:
  - rm32_stm32/src/isr_handlers.rs:106
  - rm32_stm32/src/isr_handlers.rs:128
  - rm32/src/control/isr_logic.rs:217
  - rm32/src/control/isr_logic.rs:281
- name: input_and_bidir_telemetry
  flow: timer/DMA capture -> DMA completion and software EXTI -> TransferState detection/decode -> DShot/servo actions -> optional GCR/EDT encode
    -> DMA line turnaround
  evidence:
  - rm32_stm32/src/isr_handlers.rs:149
  - rm32_stm32/src/isr_handlers.rs:179
  - rm32_stm32/src/isr_handlers.rs:223
  - rm32_stm32/src/isr_handlers.rs:260
- name: crsf_declared_not_end_to_end
  flow: handle_crsf_byte can parse bytes into throttle, but no current target interrupt invokes it.
  evidence:
  - rm32_stm32/src/isr_handlers.rs:370
  - rm32_stm32/src/mcu_g071/interrupts.rs:1
  - rm32_stm32/src/mcu_l431/interrupts.rs:1
state_ownership_and_cross_context_communication:
- owner: ISR exclusive
  state: Commutation, BEMF, duty, motor HAL, command processor, EDT scheduler, CRSF parser, transfer state, and ISR config copy.
  evidence:
  - rm32_stm32/src/isr.rs:71
- owner: foreground exclusive
  state: MainState owns measurements, PID/protection/config/timing; SystemTick owns foreground dispatch/input state.
  evidence:
  - rm32/src/main_state.rs:91
  - rm32/src/system.rs:19
- owner: cross-context
  state: SharedState atomics implement directional MotorState, IsrTiming, MainControl, and SharedComm traits; prioritized IsrAction is the command
    mailbox.
  evidence:
  - rm32/src/shared_comm.rs:17
  - rm32/src/shared_comm.rs:30
  - rm32/src/shared_state.rs:1
- owner: ISR storage transfer
  state: Boot places TargetIsrState behind an interrupt Mutex, then the first handler moves it to an UnsafeCell-backed ISR-local singleton.
  evidence:
  - rm32_stm32/src/isr.rs:100
  - rm32_stm32/src/isr.rs:113
  - rm32_stm32/src/isr_handlers.rs:36
  - rm32_stm32/src/isr_handlers.rs:69
hal_and_hardware_adapter_boundaries:
- boundary: portable ESC HAL
  description: rm32 defines motor PWM/comparator/phase/timers plus input capture, ADC, flash, telemetry, emergency-off, and system traits.
  evidence:
