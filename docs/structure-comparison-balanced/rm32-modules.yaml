  - rm32/src/hal.rs:76
  - rm32/src/hal.rs:97
  - rm32/src/hal.rs:143
- boundary: generic STM32 adapters
  description: rm32_stm32 composes raw peripheral traits into generic ADC, capture, comparator, flash, telemetry, timer, phase, and LED adapters.
  evidence:
  - rm32_stm32/src/adc_generic.rs:14
  - rm32_stm32/src/capture_generic.rs:8
  - rm32_stm32/src/comparator.rs:8
  - rm32_stm32/src/phase.rs:28
- boundary: target families
  description: Each MCU family supplies chip constants and peripheral register adapters behind one feature-selected mcu gateway.
  evidence:
  - rm32_stm32/src/mcu.rs:7
  - rm32_stm32/src/mcu.rs:24
  - rm32_stm32/src/lib.rs:54
