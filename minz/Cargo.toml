[package]
name = "minz"
version = "0.1.0"
edition = "2024"

[features]
# 48 kHz motor PWM carrier (default is 24 kHz). Build with
# `--features pwm48`. See lib.rs::PWM_FREQUENCY_HZ for the full
# carrier-tradeoff history; everything timing-critical derives from
# TIM1_AUTORELOAD so this single switch is complete.
pwm48 = []
# Firmware self-monitoring: key values -> ratch22 online banks -> surprise
# check, in main context (see src/monitor.rs). LITE tier. NOTE: pulls the
# private, gitignored `ratch22-sketch/` clone as an optional path dep, so a
# build with this feature is LOCAL-ONLY until ratch22 is published/vendored.
monitor = ["dep:ratch22"]
# Reserved for the per-epoch block-M4 shape tier.
monitor-full = ["monitor"]
# Qualification of the sibling TSFE crate `krabilorean`, consumed as a
# git-pinned dep (annotated tag v0.1.0-alpha.1 = commit 78eac27). Unlike
# `monitor`/ratch22 (local path dep), this one resolves from a real remote,
# so a `--features krabimon` build is reproducible and committable. See
# src/krabimon.rs for the onboard consumer.
krabimon = ["dep:krabilorean"]

[dependencies]
# Optional — only pulled in by `--features monitor`. Path points at the
# gitignored private clone; keep this crate's `monitor` builds off the
# committed/pre-commit path until ratch22 is public.
ratch22 = { path = "ratch22-sketch/ratch22", optional = true }
# Optional — only pulled in by `--features krabimon`. Git-pinned to the
# annotated tag (commit 78eac27). krabilorean depends on the `fixed` crate
# with const features that only exist in the fork patched below; a git dep
# does NOT inherit its own workspace's [patch] table, so minz must replicate
# the fixed-fork patch itself (see [patch.crates-io] at the bottom).
krabilorean = { git = "https://github.com/kaidokert/krabilorean-rs-private", tag = "v0.1.0-alpha.3", optional = true }
# Host-testable control/guard/telemetry logic — the extracted brain.
# `cd core && cargo test` runs its suite on the host.
minz-core = { path = "core" }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.5", features = ["paint-stack", "device", "set-vtor"] }
fugit = { version = "0.3" }

rtt-target = "0.6.2"
stm32l4xx-hal = { version = "0.7.1", features = ["stm32l431"] }

[profile.release]
# Overflow-check campaign (reset-class triage): every wrap panics
# with file:line over UART instead of silently wrapping.
overflow-checks = true
lto = "thin"
codegen-units = 1

# krabilorean (git dep above) needs the const-generic `fixed` fork. Patches
# only apply from the ROOT manifest, so this must live here in minz, not be
# inherited from krabilorean's own workspace. Harmless (unused-patch warning)
# when `krabimon` is off; required when it is on.
[patch.crates-io]
fixed = { git = "https://gitlab.com/kaidokert/fixed.git", tag = "v1.31.0-const-1" }
