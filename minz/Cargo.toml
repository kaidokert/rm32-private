[package]
name = "minz"
version = "0.1.0"
edition = "2024"

[features]
# 48 kHz motor PWM carrier (default is 24 kHz). Build with
# `--features pwm48`. See lib.rs::PWM_FREQUENCY_HZ for the full
# carrier-tradeoff history; everything timing-critical derives from
# TIM1_AUTORELOAD so this single switch is complete.
pwm48 = []

[dependencies]
# Host-testable control/guard/telemetry logic — the extracted brain.
# `cd core && cargo test` runs its suite on the host.
minz-core = { path = "core" }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.5", features = ["paint-stack", "device", "set-vtor"] }
embedded-hal = "1.0"
fugit = { version = "0.3" }
heapless = { version = "0.9.3", features= ["portable-atomic"] }
portable-atomic = { version = "1.13.1", default-features = false, features = ["critical-section"]}

rtt-target = "0.6.2"
stm32l4xx-hal = { version = "0.7.1", features = ["stm32l431"] }
systick-timer = "0.2.3"

[profile.release]
lto = "thin"
codegen-units = 1
