[package]
name = "minz-core"
version = "0.1.0"
edition = "2021"
description = "Host-testable control/guard/telemetry logic for the minz bench firmware"

# Standalone (detached from any parent workspace): host `cargo test`
# runs here directly; the ARM `minz` crate consumes it by path.
[workspace]

[dependencies]
portable-atomic = { version = "1", default-features = false }
# None. The am32 cluster structs hold plain `core::sync::atomic` refs
# (native single-word atomics on both thumbv7em and x86).

[lib]
name = "minz_core"

[features]
default = []
# Opt-in binz same-board timing A/B. The default/reference remains the
# historical AM32 temp_advance=16; this feature has no runtime branch.
bench-advance-18 = []
# Opt-in binz high-speed timing A/B. Mutually exclusive with advance18;
# default/reference behavior remains the historical value16.
bench-advance-20 = []
bench-advance-22 = []
# Binz direct-PWM experiment: polling/startup stays18; interrupt-mode COM
# reads a precomputed 18..22 level from Duty::duty_cycle.
bench-advance-scheduled = []
