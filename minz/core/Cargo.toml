[package]
name = "minz-core"
version = "0.1.0"
edition = "2021"
description = "Host-testable control/guard/telemetry logic for the minz bench firmware"

# Standalone (detached from any parent workspace): host `cargo test`
# runs here directly; the ARM `minz` crate consumes it by path.
[workspace]

[dependencies]
# Same crate the firmware uses for its statics, so the atomic refs in
# window::WindowState unify across both builds. On thumbv7em and x86
# it is a zero-cost passthrough to core atomics.
portable-atomic = { version = "1", default-features = false }

[lib]
name = "minz_core"
