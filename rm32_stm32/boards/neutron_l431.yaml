name: "L431 Neutron"
mcu: stm32l431
tuning: rig
dead_time: 45  # AM32 default for L431 Vimdrones (0x2D, ~562 ns @ 80 MHz)
# ADC cal — Vimdrones L431 bench, schematic-derived + bench-validated in
# minz (VBAT 3.6k/30k divider = 9.33x ratio; INA180A1 20V/V x 1.5mOhm =
# 30mV/A, no offset). Old values (210/16/498) read 8.15V as 1.8V and idle
# current as -3.1A. voltage_divider_x100 = ratio*100; millivolt_per_amp is in
# units of (mV per A)/10 given units.rs CURRENT_MV_SCALE=80 (raw*80 =
# mV*100). ±25% sense-cal uncertainty applies (single-point cal).
voltage_divider_x100: 933
millivolt_per_amp: 3
current_offset: 0
current_adc_channel: 8
voltage_adc_channel: 11
stall_protect_interval: 6500
bench_dir_reversed: true  # prop pushes into the table (normal rotation lifts the rig)
# Shared low-L motor (relay to binz, 2026-10-25): 15 % carrier A/B, 3 runs a
# side interleaved — 24 kHz variable held 2/3 (186-213 mA), 48 kHz fixed held
# 3/3 (106-133 mA, 784-794 eHz = binz's 786 on the same motor). Same carrier
# as binz (AM32 pwm_frequency=48, variable_pwm=0).
bench_pwm_khz: 48
bench_fixed_pwm: true
min_bemf_counts: 3
bemf_pins:
  phase_a: PB7   # COMP2 INM IO2
  phase_b: PA5   # COMP2 INM IO5
  phase_c: PA4   # COMP2 INM IO4
  common: PB4    # COMP2 INP IO1
