name: "VimDrones L4"
mcu: stm32l431
dead_time: 60
voltage_divider: 933  # 9.33x ratio *100 (3.6k/30k), minz bench-validated
millivolt_per_amp: 3  # INA180A1 30mV/A in (mV/A)/10 units, see neutron_l431.yaml
current_offset: 0
current_adc_channel: 8
voltage_adc_channel: 11
bemf_pins:
  phase_a: PB7   # COMP2 INM IO2
  phase_b: PA5   # COMP2 INM IO5
  phase_c: PA4   # COMP2 INM IO4
  common: PB4    # COMP2 INP IO1
